<div class="home-page-contact">
    <div class="section-header">
        <span class="eyebrow">Get In Touch</span>
        <h1>Contact Us to Get Quotation</h1>
        <p>Have a question or need a custom quote? Fill out the form below and we'll get back to you shortly.</p>
    </div>
    <div class="contact-layout container">
        <div class="contact-info">
            <div class="info-item">
                <i class="fa-solid fa-envelope"></i>
                <div>
                    <h6>Email</h6>
                    <span>info&#64;example.com</span>
                </div>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <div>
                    <h6>Phone</h6>
                    <span>+20 100 000 0000</span>
                </div>
            </div>
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <h6>Address</h6>
                    <span>Alexandria, Egypt</span>
                </div>
            </div>
        </div>

        <form [formGroup]="contactForm" class="contact-form" (ngSubmit)="SubmitContactForm()">
          <div class="form-row">
            <div class="form-group">
              <label for="fname">First Name</label>
              <input type="text" id="fname" class="contact-input-el" placeholder="Your name.." formControlName="fname">
            </div>
            <div class="form-group">
              <label for="lname">Last Name</label>
              <input type="text" id="lname" class="contact-input-el" placeholder="Your last name.." formControlName="lname">
            </div>
          </div>

          <div class="form-group">
            <label for="country">Country</label>
            <select id="country" name="country" class="contact-input-el" formControlName="country">
              <option value="australia">Australia</option>
              <option value="canada">Canada</option>
              <option value="usa">USA</option>
            </select>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <textarea id="subject" class="contact-input-el" placeholder="Write something.." rows="6" formArrayName="subject"></textarea>
          </div>

          <input type="submit" value="Send Message" [disabled]="contactForm.invalid">
        </form>
      </div>
</div>
