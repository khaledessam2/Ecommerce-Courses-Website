<div class="faq">
  <div class="section-header">
    <h1>Frequently Asked Questions</h1>
    <p>Answers to the questions we get asked the most.</p>
  </div>

  <div class="faq-list">
    <div class="faq-item" *ngFor="let faq of faqs; let i = index" [class.active]="activeIndex === i">
      <button class="faq-question" (click)="toggle(i)">
        {{ faq.question }}
        <i class="fa-solid" [ngClass]="activeIndex === i ? 'fa-chevron-up' : 'fa-chevron-down'"></i>
      </button>
      <div class="faq-answer" *ngIf="activeIndex === i">
        <p>{{ faq.answer }}</p>
      </div>
    </div>
  </div>
</div>
