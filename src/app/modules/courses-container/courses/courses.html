<app-filter
  [All]="AllCount"
  [Free]="FreeCount"
  [premium]="PremiumCount"
  [(Selected)]="FilterPrice"
></app-filter>

@if (filterCourses.length === 0) {
  <p class="text-center text-muted my-4">
    No courses match your filter.
  </p>
}

@if (LoaderService.isLoading$ | async) {
  <div class="row g-3 px-3 overflow-hidden">
    <div class="col-sm-6 col-md-4 col-lg-3 cursor-pointer d-flex" *ngFor="let item of [1,2,3,4,5,6,7,8]">
      <div class="card course-card h-80">
        <div class="course-img-wrap">
          <app-skelton width="100%" height="200px"></app-skelton>
        </div>
        <div class="card-body d-flex flex-column">
          <app-skelton width="60%" height="10px"></app-skelton>
          <app-skelton width="100%" height="10px"></app-skelton>
          <app-skelton width="100%" height="10px"></app-skelton>
          <app-skelton width="100%" height="10px"></app-skelton>
          <app-skelton width="40%" height="10px"></app-skelton>
        </div>
      </div>
    </div>
  </div>
}@else {
  <div class="row g-3 px-3">
    <div appHeighlight class="col-sm-6 col-md-4 col-lg-3 cursor-pointer d-flex" *ngFor="let Course of filterCourses; let i = index">
      <div class="card course-card h-80">
        <div class="course-img-wrap">
          <img [src]="Course.image ? Course.image  : 'images/noimage.jpg'" class="card-img-top product-img" [alt]="Course.name" />
          <span class="price-badge" [ngStyle]="{ background: Course.price === 'Free' ? 'var(--color-primary)' : 'var(--color-dark)' }">
            {{ Course.price === 'Free' ? 'Free' : '$' + Course.price }}
          </span>
        </div>
        <div class="card-body d-flex flex-column">
          <h3 [SetBackground]="{'textColor' : 'var(--color-dark)' , 'FontWeight' : '700'}" class="fs-5 course-title">{{ Course.name }}</h3>
          <p class="flex-grow-1 course-desc">{{ Course.description }}</p>
          <span class="stock-badge mb-3" [ngStyleDir]="{ fontWeight: '600', color : Course.is_in_inventory ? '#1a9c53' : 'var(--color-primary)' }">
            <i class="fa-solid" [ngClass]="Course.is_in_inventory ? 'fa-circle-check' : 'fa-circle-xmark'"></i>
            {{ Course.is_in_inventory ? 'In Stock' : 'Out of Stock' }}
          </span>
          <div class="d-flex align-items-center gap-2">
            <button class="btn btn-details" aria-label="Add to cart" [disabled]="!Course.is_in_inventory" (click)="cartService.add(Course)"><i class="fa-solid fa-cart-plus"></i></button>
            <button class="btn btn-buy flex-grow-1" (click)="GoToCheckout(Course)"><i class="fa-solid fa-cart-shopping me-1"></i>Buy</button>
            <button class="btn btn-details flex-grow-1" (click)="GoToDetails(Course.id)">Details</button>
          </div>
        </div>
      </div>
    </div>
  </div>
}
